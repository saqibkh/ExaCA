name: CI-simulated-GPU

# The CUDA job in CI.yml builds ExaCA with Kokkos' CUDA backend but cannot run
# it, since GitHub's runners have no GPU. PantheonSim simulates an NVIDIA T4
# on the runner's CPU, so the unit tests run here on the CUDA backend too. It
# checks results, not speed; a real GPU is still the final word.
on:
  push:
    branches:
      - master
      - ci-simulated-gpu
  pull_request:
    branches:
      - master
concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job reads the repository and nothing else. The simulator's action uses
# no token or secrets, and installs packages only from Ubuntu and NVIDIA.
permissions:
  contents: read

jobs:
  CUDA:
    defaults:
      run:
        shell: bash
    env:
      # as in CI.yml; also let Open MPI start as root if it ever does
      OMPI_MCA_btl_vader_single_copy_mechanism: "none"
    runs-on: ubuntu-24.04
    steps:
      - name: Simulated GPU (NVIDIA T4) and CUDA 12.6
        uses: pantheongpu/pantheonsim@45c244845fd024481c9cd92fe6cc809e764f5cc5 # pantheonsim 335 + 336 + 337, rehearsal
        with:
          gpu: nvidia/t4
          cuda-toolkit: '12.6'
          library-path: false
      - name: Install packages
        run: sudo apt-get install -y cmake libopenmpi-dev openmpi-bin libgtest-dev
      - name: Checkout json
        uses: actions/checkout@v3
        with:
          repository: nlohmann/json
          ref: v3.11.2
          path: json
      - name: Build json
        working-directory: json
        run: |
          cmake -B build \
            -DCMAKE_INSTALL_PREFIX=$HOME/json \
            -DCMAKE_BUILD_TYPE=Release \
            -DJSON_BuildTests=OFF
          cmake --build build --parallel 2
          cmake --install build
      - name: Checkout kokkos
        uses: actions/checkout@v3
        with:
          repository: kokkos/kokkos
          ref: 4.5.01
          path: kokkos
      # Turing (sm_75) is the simulated T4. Kokkos' CUDA backend is built with
      # its own nvcc_wrapper.
      - name: Build kokkos
        working-directory: kokkos
        run: |
          cmake -B build \
            -DCMAKE_CXX_COMPILER=$PWD/bin/nvcc_wrapper \
            -DCMAKE_INSTALL_PREFIX=$HOME/kokkos \
            -DCMAKE_BUILD_TYPE=Release \
            -DKokkos_ENABLE_CUDA=ON \
            -DKokkos_ARCH_TURING75=ON \
            -DKokkos_ENABLE_CUDA_LAMBDA=ON
          cmake --build build --parallel 2
          cmake --install build
      - name: Checkout ExaCA
        uses: actions/checkout@v3
      - name: Build ExaCA
        run: |
          cmake -B build \
            -D CMAKE_CXX_COMPILER=$HOME/kokkos/bin/nvcc_wrapper \
            -D CMAKE_INSTALL_PREFIX=$HOME/exaca \
            -D CMAKE_PREFIX_PATH="$HOME/kokkos;$HOME/json" \
            -D CMAKE_BUILD_TYPE=Release \
            -D MPIEXEC_MAX_NUMPROCS=2 \
            -D MPIEXEC_PREFLAGS="--oversubscribe" \
            -D ExaCA_ENABLE_TESTING=ON
          cmake --build build --parallel 2
          cmake --install build
      - name: Unit test ExaCA on the simulated GPU
        run: |
          vgpu run ctest --test-dir build --output-on-failure
